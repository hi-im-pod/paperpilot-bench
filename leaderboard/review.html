<title>PaperPilot-Bench Label Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: a narrow list of review items on the left, the item being reviewed on the right; one column on phones. */
:root {
  --ink: #1E2A38; --ink-soft: #55606E; --paper: #F4F6F8; --panel: #FFFFFF; --rule: #D6DCE3;
  --hl: #F2D54B; --ok: #3A8C78; --bad: #B5452F; --focus: #2C6BD6; --claude: #E8EDF3;
  --sans: "IBM Plex Sans", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #E6EAF0; --ink-soft: #A3ADBA; --paper: #151B23; --panel: #1C2430; --rule: #2E3946; --focus: #7AA7F0; --claude: #26303D; --hl: #E9CB3E; color-scheme: dark; }
}
:root[data-theme="dark"] { --ink: #E6EAF0; --ink-soft: #A3ADBA; --paper: #151B23; --panel: #1C2430; --rule: #2E3946; --focus: #7AA7F0; --claude: #26303D; --hl: #E9CB3E; color-scheme: dark; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); font-variant-numeric: tabular-nums;
  /* Korean wraps between words, not inside them; long IDs and URLs may still break. */
  word-break: keep-all; overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1 { font: 600 30px/1.15 var(--serif); margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
.lede { color: var(--ink-soft); margin: 6px 0 0; max-width: 72ch; }
.head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
#lang { font: inherit; font-size: 14px; border-radius: 4px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
.progress { margin-top: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.bar { width: 220px; height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; margin-top: 22px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
nav { display: flex; flex-direction: column; gap: 14px; }
nav h2 { font-size: 13px; color: var(--ink-soft); font-weight: 500; margin: 0 0 4px; }
nav ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
nav button { width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--ink); background: none; border: none; border-radius: 4px;
  padding: 6px 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
nav button:hover { background: var(--claude); }
nav button[aria-current="true"] { background: var(--panel); outline: 1px solid var(--rule); }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--rule); flex: none; margin-top: 6px; }
.dot.done { background: var(--ok); border-color: var(--ok); }
main.item { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 20px 22px; min-width: 0; }
.task { background: var(--paper); border-radius: 4px; padding: 10px 12px; margin: 8px 0 4px; }
.how { color: var(--ink-soft); font-size: 14px; margin: 4px 0 0; max-width: 75ch; }
.claude { background: var(--claude); border-radius: 3px; padding: 1px 6px; font-size: 13px; white-space: nowrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 6px; border-bottom: 1px solid var(--rule); }
th { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
td.choice { white-space: nowrap; width: 1%; }
details summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; }
details p { margin: 6px 0 0; font-size: 13px; }
blockquote { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--rule); background: var(--paper); font-size: 14px; max-height: 320px; overflow: auto; }
.evidence { font-size: 12.5px; color: var(--ink-soft); }
label { font-size: 14px; }
.radios { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 8px 0; }
.radios label { display: flex; gap: 6px; align-items: flex-start; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 4px; cursor: pointer; max-width: 360px; }
.radios small { display: block; color: var(--ink-soft); font-size: 12.5px; }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; }
input[type=text], textarea { width: 100%; }
textarea { min-height: 64px; }
.cell { border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px; margin: 8px 0; display: grid; gap: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
button.primary { font: inherit; font-weight: 500; border-radius: 4px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
button.quiet { font: inherit; border-radius: 4px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.note { color: var(--ink-soft); font-size: 13px; }
.empty { padding: 36px 20px; color: var(--ink-soft); border: 1.5px dashed var(--rule); border-radius: 6px; }
a { color: var(--focus); }
</style>

<div class="wrap">
  <header>
    <div class="head-row"><h1 id="title">PaperPilot-Bench 라벨 검토</h1><button id="lang" type="button">English</button></div>

    <p class="lede note" id="lede-note"></p>

    othersDid: n => `${n} other reviewer${n > 1 ? "s" : ""} did this one.`,
    rateAll: "Rate all three criteria.", chooseLabel: "Choose a label.", sayAccurate: "Say whether the gap notes are accurate.",
    noMe: "This view doesn't know who you are, so it can't save. Open the link inside claude.ai while signed in.",
    saving: "Saving…", saved: "Saved.",
    noWrite: "You can view this page but not save reviews. Ask the page owner for contributor access.",
    saveFailed: m => `Saving failed: ${m}. Your answers are still on the page; try again.`,
    itemFailed: id => `Item ${id} couldn't be shown.`, pickAnother: d => `Pick another item. Details for the page owner: ${d}`,
    notLoaded: "Not loaded.",
    st: {
      slow: ["The review items are taking longer than usual to load.", "Reload the page. If this keeps happening, send the page owner a screenshot of this message."],
      noClaude: ["This copy of the page can't reach the review database.", "Open the review link inside claude.ai (claude.ai/artifact/…). A downloaded copy or the page's own address won't load the items."],
      noDb: ["This view can't open the review database.", "Open the review link inside claude.ai while signed in. If you are, check the page's Permissions menu and allow its database."],
      noItems: ["No review items yet.", "The page owner hasn't loaded them."],
      loadErr: ["The review items couldn't be loaded.", d => `Reload the page. Details for the page owner: ${d}`],
      startErr: ["The review page hit an error while starting.", d => `Reload the page. Details for the page owner: ${d}`],
    },
  },
};
let lang = "ko";
try { const saved = localStorage.getItem("pp-review-lang"); if (saved === "en" || saved === "ko") lang = saved; } catch (e) { /* storage blocked: stay on Korean */ }
const S = () => STR[lang];

let db = null, user = null, me = null, items = [], reviews = {}, current = null, lastStatus = null;

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") el.textContent = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
}
const link = (url, text) => h("a", {href: url, target: "_blank", rel: "noopener", text});
const mine = id => reviews[me]?.verdicts?.[id];
const reviewers = id => Object.values(reviews).filter(r => r.verdicts?.[id]).length;

function renderStatic() {
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = S().title;
  document.getElementById("lede").textContent = S().lede;
  document.getElementById("lede-note").textContent = S().ledeNote;
  const btn = document.getElementById("lang");
  btn.textContent = S().switchTo;
  btn.setAttribute("aria-label", S().switchLabel);
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("pp-review-lang", lang); } catch (e) { /* not saved; the toggle still works this session */ }
  renderStatic();
  if (current) show(current);
  else if (lastStatus) status(...lastStatus);
  else {
    document.getElementById("nav").replaceChildren(h("div", {class: "note", text: S().loadingNav}));
    document.getElementById("item").replaceChildren(h("div", {class: "empty", text: S().loadingItem}));
  }
}

function renderNav() {
  const groups = [[S().groupGold, items.filter(i => i.source === "gold")], [S().groupJudge, items.filter(i => i.source === "judge")]];
  document.getElementById("nav").replaceChildren(...groups.map(([title, list]) => h("div", {}, h("h2", {text: `${title}, ${list.length}`}),
    h("ul", {}, list.map(i => h("li", {}, h("button", {"aria-current": current === i.id ? "true" : "false", onclick: () => show(i.id)},
      h("span", {text: navLabel(i)}), h("span", {class: "dot" + (mine(i.id) ? " done" : ""), title: mine(i.id) ? S().dotDone : S().dotTodo}))))))));
  const done = items.filter(i => mine(i.id)).length;
  const others = Object.keys(reviews).filter(k => k !== me && Object.keys(reviews[k].verdicts || {}).length).length;
  document.getElementById("progress").replaceChildren(
    h("span", {class: "bar"}, h("i", {style: `width:${items.length ? done / items.length * 100 : 0}%`})),
    h("span", {text: S().reviewedOf(done, items.length)}),
    h("span", {class: "note", text: others ? S().others(others) : S().noOthers}));
}
function navLabel(i) {
  return i.source === "gold"
    ? `${i.item_id}, ${S().type[i.task_type]}${i.track === "hard" ? S().hard : ""}`
    : `${S().decision} ${i.id.replace("judge-", "")}: ${S().kindShort[i.kind]}`;
}

function radios(name, options, value) {
  return h("div", {class: "radios", role: "radiogroup"}, options.map(([v, text, help]) =>
    h("label", {}, h("input", {type: "radio", name, value: v, checked: value === v}), h("span", {}, text, help ? h("small", {text: help}) : null))));
}
const picked = name => document.querySelector(`input[name="${name}"]:checked`)?.value;

const GOLD = {
  find_papers(i, v) {
    return [h("p", {class: "how", text: S().fpHow}),
      h("div", {class: "scroll"}, h("table", {}, h("thead", {}, h("tr", {}, h("th", {text: S().thPaper}), h("th", {text: S().thClaude}), h("th", {text: S().thYours}))),
        h("tbody", {}, i.papers.map(p => h("tr", {},
          h("td", {}, link(p.url, p.title), h("details", {}, h("summary", {text: S().abstract}), h("p", {text: p.abstract}))),
          h("td", {}, h("span", {class: "claude", text: String(p.claude)})),
          h("td", {class: "choice"}, h("select", {"data-pid": p.paper_id, "aria-label": S().gradeFor(p.title)},
            [0, 1, 2].map(g => h("option", {value: g, selected: (v?.grades?.[p.paper_id] ?? p.claude) === g, text: String(g)})))))))))];
  },
  comparison_table(i, v) {
    return [h("p", {class: "how", text: S().ctHow}),
      ...i.cells.map(c => h("div", {class: "cell"},
        h("div", {}, h("strong", {text: c.column}), " · ", link(c.url, c.title)),
        h("div", {class: "note", text: `${S().setting}${c.setting}${c.allowed ? `${S().allowed}${c.allowed.join(", ")}` : ""}`}),
        c.quote ? h("blockquote", {text: c.quote}) : null,
        c.note ? h("div", {class: "note", text: `${S().claudeNote}${c.note}`}) : null,
        h("div", {class: "row"}, h("span", {}, "Claude: ", h("span", {class: "claude", text: c.claude})),
          h("label", {}, S().correctValue, h("input", {type: "text", "data-cell": `${c.paper_id}|${c.column}`, value: v?.cells?.[`${c.paper_id}|${c.column}`] ?? c.claude, style: "width:auto;min-width:220px"})))))];
  },
  citation_links(i, v) {
    const t = Object.fromEntries(i.papers.map(p => [p.paper_id, p.title]));
    return [h("p", {class: "how", text: S().clHow}),
      h("div", {class: "scroll"}, h("table", {}, h("thead", {}, h("tr", {}, h("th", {text: S().thCites}), h("th", {text: S().thPair}), h("th", {text: S().thExcerpt}))),
        h("tbody", {}, i.edges.map(e => h("tr", {},
          h("td", {class: "choice"}, h("input", {type: "checkbox", "data-edge": `${e.citing}>${e.cited}`, checked: v?.edges?.[`${e.citing}>${e.cited}`] ?? e.claude, "aria-label": S().citesAria(t[e.citing], t[e.cited])})),
          h("td", {}, link(`https://arxiv.org/abs/${e.citing}`, t[e.citing]), " → ", link(`https://arxiv.org/abs/${e.cited}`, t[e.cited]),
            h("div", {class: "note", text: e.in_s2 && e.in_reference_list ? S().srcAgree : e.in_s2 ? S().srcS2 : S().srcRef})),
          h("td", {class: "evidence", text: e.evidence || S().noEvidence})))))),
      h("h3", {text: S().missedCites}), h("input", {type: "text", id: "missing", placeholder: S().missedCitesPh, value: v?.missing || ""})];
  },
  grounded_claims(i, v) {
    return [h("p", {class: "how", text: S().gcHow}),
      h("h3", {text: S().draftAnswer}), h("blockquote", {text: i.draft_answer}),
      ...i.supporting.map(s => h("div", {class: "cell"}, h("label", {class: "row"}, h("input", {type: "checkbox", "data-sup": s.paper_id, checked: v?.supporting?.[s.paper_id] ?? true}), h("span", {}, S().needed, link(s.url, s.title))),
        h("blockquote", {text: s.quote}))),
      h("h3", {text: S().missingPapers}), h("input", {type: "text", id: "missing", placeholder: S().missingPapersPh, value: v?.missing || ""})];
  },
  followup_questions(i, v) {
    return [h("p", {class: "how", text: S().fuHow}),
      ...i.papers.map(p => h("div", {}, link(p.url, p.title), h("details", {}, h("summary", {text: S().abstract}), h("p", {text: p.abstract})))),
      h("h3", {text: S().gapNotes}), h("blockquote", {text: i.gap_notes}),
      ...(i.gaps || []).map(g => h("div", {class: "evidence"}, `${g.paper_id}: “${g.quote}”`)),
      radios("ok", [["yes", S().accurate], ["no", S().needsChanges]], v?.ok)];
  },
};

const JUDGE = {
  claim_support(i, v) {
    return [h("h3", {text: S().claim}), h("blockquote", {text: i.claim}), h("h3", {text: S().passage}), h("blockquote", {text: i.passage}),
      radios("label", [["supported", ...S().supported], ["partial", ...S().partial], ["unsupported", ...S().unsupported]], v?.label)];
  },
  text_equiv(i, v) {
    return [h("p", {class: "how", text: S().teHow(i.column)}),
      h("div", {class: "cell"}, h("div", {}, h("strong", {text: S().reference}), i.gold), h("div", {}, h("strong", {text: S().candidate}), i.pred)),
      radios("label", [["true", S().same], ["false", S().different]], v?.label)];
  },
  followup_score(i, v) {
    const [s, g, n] = (v?.label || "").split("/");
    const sel = (name, val, [text, help]) => h("label", {class: "cell"}, h("strong", {text}), h("small", {class: "note", text: help}),
      h("select", {id: name}, ["", 1, 2, 3, 4, 5].map(x => h("option", {value: x, selected: String(x) === val, text: x === "" ? S().choose : String(x)}))));
    return [h("p", {class: "how", text: S().fsHow(i.topic, [].concat(i.paper_titles).join("; "))}),
      h("h3", {text: S().gapNotes}), h("blockquote", {text: i.gap_notes}), h("h3", {text: S().questionToRate}), h("blockquote", {text: i.question}),
      h("div", {class: "row"}, sel("s", s, S().specific), sel("g", g, S().grounded), sel("n", n, S().novel))];
  },
};

function show(id) {
  current = id;
  try { render(id); } catch (e) {
    // One malformed item mustn't freeze the page: say which one and keep the list usable.
    document.getElementById("item").replaceChildren(h("div", {class: "empty"},
      h("p", {text: S().itemFailed(id)}), h("p", {class: "note", text: S().pickAnother(errText(e))})));
    renderNav();
  }
}

function render(id) {
  const i = items.find(x => x.id === id), v = mine(id);
  const body = i.source === "gold" ? GOLD[i.task_type](i, v) : JUDGE[i.kind](i, v);
  const head = i.source === "gold"
    ? [h("h2", {text: `${i.item_id}: ${S().type[i.task_type]}`}),
       i.track === "hard" ? h("p", {class: "note", text: S().hardNote}) : null,
       h("div", {class: "task", text: i.input.topic || i.input.question || `${S().papersPrefix}${(i.input.paper_ids || []).join(", ")}`})]
    : [h("h2", {text: S().type[i.kind]})];
  const others = reviewers(id) - (v ? 1 : 0);
  document.getElementById("item").replaceChildren(...head.filter(Boolean), ...body,
    h("h3", {text: S().noteOptional}), h("textarea", {id: "note", text: v?.note || ""}),
    h("div", {class: "actions"}, h("button", {class: "primary", id: "save", onclick: () => save(i)}, v ? S().update : S().save),
      h("button", {class: "quiet", onclick: () => next(1)}, S().skip), h("span", {class: "msg", id: "msg", "aria-live": "polite"}),
      h("span", {class: "note", text: others ? S().othersDid(others) : ""})));
  renderNav();
}

function collect(i) {
  const note = document.getElementById("note").value.trim(), out = {note, at: new Date().toISOString(), lang};
  if (i.source === "judge") {
    if (i.kind === "followup_score") {
      const v = ["s", "g", "n"].map(k => document.getElementById(k).value);
      if (v.includes("")) return {error: S().rateAll};
      return {...out, label: v.join("/")};
    }
    const label = picked("label");
    return label ? {...out, label} : {error: S().chooseLabel};
  }
  if (i.task_type === "find_papers") out.grades = Object.fromEntries([...document.querySelectorAll("select[data-pid]")].map(s => [s.dataset.pid, Number(s.value)]));
  if (i.task_type === "comparison_table") out.cells = Object.fromEntries([...document.querySelectorAll("input[data-cell]")].map(s => [s.dataset.cell, s.value.trim()]));
  if (i.task_type === "citation_links") { out.edges = Object.fromEntries([...document.querySelectorAll("input[data-edge]")].map(s => [s.dataset.edge, s.checked])); out.missing = document.getElementById("missing").value.trim(); }
  if (i.task_type === "grounded_claims") { out.supporting = Object.fromEntries([...document.querySelectorAll("input[data-sup]")].map(s => [s.dataset.sup, s.checked])); out.missing = document.getElementById("missing").value.trim(); }
  if (i.task_type === "followup_questions") { out.ok = picked("ok"); if (!out.ok) return {error: S().sayAccurate}; }
  return out;
}

async function save(i) {
  const msg = document.getElementById("msg"), btn = document.getElementById("save");
  if (!me) { msg.className = "msg bad"; msg.textContent = S().noMe; return; }
  const verdict = collect(i);
  if (verdict.error) { msg.className = "msg bad"; msg.textContent = verdict.error; return; }
  btn.disabled = true; msg.className = "msg"; msg.textContent = S().saving;
  try {
    const verdicts = {...(reviews[me]?.verdicts || {}), [i.id]: verdict};
    await db.doc("reviews/" + me).set({verdicts, updated_at: new Date().toISOString()});
    reviews[me] = {verdicts};
    msg.className = "msg ok"; msg.textContent = S().saved;
    renderNav();
    setTimeout(() => next(1, true), 500);
  } catch (e) {
    msg.className = "msg bad";
    msg.textContent = e?.code === "permission_denied" ? S().noWrite : S().saveFailed(e?.message || e);
  } finally { btn.disabled = false; }
}

function next(step, unreviewedOnly = false) {
  const idx = items.findIndex(x => x.id === current);
  for (let k = 1; k <= items.length; k++) {
    const cand = items[(idx + k * step + items.length) % items.length];
    if (!unreviewedOnly || !mine(cand.id)) return show(cand.id);
  }
  show(items[(idx + 1) % items.length].id);
}

// Every way startup can fail gets its own message, so "it won't load" can be diagnosed from a screenshot.
function status(key, detailArg) {
  lastStatus = [key, detailArg];
  const [text, detail] = S().st[key];
  document.getElementById("nav").replaceChildren(h("div", {class: "note", text: S().notLoaded}));
  document.getElementById("item").replaceChildren(h("div", {class: "empty"}, h("p", {text}),
    h("p", {class: "note", text: typeof detail === "function" ? detail(detailArg) : detail})));
}
const errText = e => [e?.code, e?.message || String(e)].filter(Boolean).join(": ");

document.getElementById("lang").addEventListener("click", () => setLang(lang === "ko" ? "en" : "ko"));
setLang(lang);

(async () => {
  try {
    const timer = setTimeout(() => { if (!items.length) status("slow"); }, 15000);
    if (!window.claude?.use) { clearTimeout(timer); return status("noClaude"); }
    db = await window.claude.use("db");
    user = await window.claude.use("user");
    if (!db) { clearTimeout(timer); return status("noDb"); }
    me = user ? await user.id() : null;
    db.collection("items").orderBy("order").onSnapshot(s => {
      clearTimeout(timer);
      items = s.docs.map(d => ({id: d.id, ...d.data()}));
      if (!items.length) return status("noItems");
      lastStatus = null;
      if (!current) show((items.find(i => !mine(i.id)) || items[0]).id); else renderNav();
    }, e => { clearTimeout(timer); status("loadErr", errText(e)); });
    db.collection("reviews").onSnapshot(s => {
      reviews = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
      if (items.length) renderNav();
    }, () => {});
  } catch (e) {
    status("startErr", errText(e));
  }
})();
</script>
